<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<title>Farm Manager</title>
<style>
:root{--g:#2e7d32;--bg:#eef3ea}
html{font-size:18px}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:#1a1a1a;padding-bottom:90px;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:16px;font-size:1.3rem;font-weight:700}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #0002}
.rem{border-left:6px solid #ef6c00}
h3{margin:0 0 8px;font-size:1.15rem}
label{display:block;font-weight:600;margin:14px 0 5px}
input,select{width:100%;box-sizing:border-box;padding:14px;font-size:1.05rem;border:2px solid #cfd8cc;border-radius:12px;background:#fff;color:#222}
.pri{width:100%;padding:16px;margin-top:18px;font-size:1.1rem;font-weight:700;background:var(--g);color:#fff;border:0;border-radius:12px}
.sec{width:100%;padding:14px;margin-top:10px;font-size:1.05rem;font-weight:600;background:#fff;color:#444;border:2px solid #cfd8cc;border-radius:12px}
.done{padding:10px 14px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:700;font-size:.95rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccc;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 2px;font-size:.8rem;color:#555;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.5rem}
nav button.on{color:var(--g);font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border-radius:14px;padding:14px;color:#fff}
.stat small{display:block;font-size:.9rem;opacity:.95}
.stat b{font-size:1.35rem}
.profit{grid-column:1/3;background:var(--g)}.profit.neg{background:#c62828}.profit b{font-size:2rem}
.sales{background:#1565c0}.costs{background:#ef6c00}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
.row:last-child{border:0}
.sub{color:#555;font-size:.9rem}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px 4px;border:2px solid #cfd8cc;background:#fff;border-radius:12px;font-size:1rem;font-weight:600;color:#333}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.filt{padding-top:6px;padding-bottom:16px}.filt label{margin-top:8px}
.pos{color:#2e7d32}.neg{color:#c62828}.hide{display:none}
.x{background:none;border:0;color:#c62828;font-size:1.3rem;padding:6px 10px}
.err{color:#c62828;font-weight:600}
.tap{flex:1;min-width:0}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;margin-top:8px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--g);min-height:3px}
.bar i.n{background:#c62828}
.bar small{font-size:.75rem;color:#555;margin-top:4px}
.bar b{font-size:.75rem;margin-bottom:3px}
.est{margin:6px 0 4px}
</style></head><body>
<header>🌾 Farm Manager</header>
<main id="app"></main>
<nav id="nav" class="hide">
<button data-t="home"><span>🏠</span>Home</button>
<button data-t="farm"><span>🌱</span>Farm</button>
<button data-t="add"><span>➕</span>Add</button>
<button data-t="ins"><span>📊</span>Insights</button>
<button id="out"><span>🚪</span>Exit</button>
</nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,getDoc,setDoc,updateDoc,getDocs,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyCfTYGe8FCBcHpoTV9rb0s_mBAX_nUz-qE",
  authDomain:"kandupila-farm.firebaseapp.com",
  projectId:"kandupila-farm",
  storageBucket:"kandupila-farm.firebasestorage.app",
  messagingSenderId:"877394060915",
  appId:"1:877394060915:web:76539f7c12b644295aac06"
};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({})});
const MAX_DEVICES=3;
const $=id=>document.getElementById(id),A=$("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"TSh "+Math.round(n).toLocaleString();
const kfmt=n=>{const a=Math.abs(n),s=n<0?"-":"";return s+(a>=1e6?(a/1e6).toFixed(1)+"M":Math.round(a/1000)+"k")};
const todayStr=()=>{const x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const dayDiff=d=>Math.round((new Date(d+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/864e5);
let ents=[],recs=[],tab="home",kind="cost",editId=null,blockMsg="",fMonth="all",fEnt="all";
let devId=localStorage.getItem("devId");
if(!devId){devId=crypto.randomUUID();localStorage.setItem("devId",devId)}

async function checkDevice(){
  try{
    const ref=doc(db,"devices",devId);
    if((await getDoc(ref)).exists()){localStorage.setItem("devOk","1");return true}
    const all=await getDocs(collection(db,"devices"));
    if(all.size>=MAX_DEVICES)return false;
    await setDoc(ref,{name:navigator.userAgent.slice(0,60),added:Date.now()});
    localStorage.setItem("devOk","1");return true;
  }catch(e){return localStorage.getItem("devOk")==="1"}
}
async function load(){
  ents=(await getDocs(collection(db,"enterprises"))).docs.map(d=>({id:d.id,...d.data()}));
  recs=(await getDocs(collection(db,"records"))).docs.map(d=>({id:d.id,...d.data()}));
}
const tot=l=>{let c=0,s=0;l.forEach(r=>{if(r.kind==="cost")c+=r.amount;if(r.kind==="sale")s+=r.amount});return{c,s,p:s-c}};
const outSum=l=>{const m={};l.forEach(r=>{if(r.kind==="sale"&&r.qty&&r.unit){const u=r.unit.trim().toLowerCase();m[u]=(m[u]||0)+r.qty}});
  return Object.entries(m).map(([u,q])=>`${+q.toFixed(2)} ${esc(u)}`).join(", ")};
const icon=e=>e.type==="Crop"?"🌱":"🐄";
const inMonth=r=>fMonth==="all"||(r.date||"").startsWith(fMonth);
const monthLabel=m=>{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})};
const monthShort=m=>{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString(undefined,{month:"short"})};

function loginView(msg=""){
  $("nav").classList.add("hide");
  A.innerHTML=`<div class="card"><h3>Sign in</h3>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="pri" id="go">Sign in</button><p class="err">${msg}</p></div>`;
  $("go").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){loginView("Wrong email or password")}};
}
onAuthStateChanged(auth,async u=>{
  if(!u){loginView(blockMsg);blockMsg="";return}
  if(!(await checkDevice())){blockMsg="This device is not registered.";signOut(auth);return}
  try{await load()}catch(e){}
  $("nav").classList.remove("hide");render();
});

function render(){
  document.querySelectorAll("#nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  window.scrollTo(0,0);
  if(tab==="home")home();else if(tab==="farm")farm();else if(tab==="ins")ins();else add();
}
function home(){
  const months=[...new Set(recs.map(r=>(r.date||"").slice(0,7)).filter(Boolean))];
  if(fMonth!=="all"&&!months.includes(fMonth))months.push(fMonth);
  months.sort().reverse();
  if(fEnt!=="all"&&!ents.some(e=>e.id===fEnt))fEnt="all";
  const fr=recs.filter(r=>inMonth(r)&&(fEnt==="all"||r.entId===fEnt));
  const t=tot(fr);
  const pend=recs.filter(r=>r.remind&&!r.done).sort((a,b)=>a.remind.localeCompare(b.remind));
  const remHtml=pend.length?`<div class="card rem"><h3>⏰ Reminders</h3>${pend.map(r=>{
    const e=ents.find(x=>x.id===r.entId),n=dayDiff(r.remind);
    const when=n<0?`Overdue by ${-n} day${-n>1?"s":""}`:n===0?"Today":n===1?"Tomorrow":`In ${n} days`;
    return `<div class="row"><div class="tap" data-edit="${r.id}"><b>${esc(r.label)}</b><div class="sub ${n<0?"neg":""}">${when} · ${esc(e?e.name:"?")}</div></div><button class="done" data-done="${r.id}">Done ✓</button></div>`}).join("")}</div>`:"";
  const rows=ents.filter(e=>fEnt==="all"||e.id===fEnt).map(e=>{
    const l=recs.filter(r=>r.entId===e.id&&inMonth(r)),x=tot(l),o=outSum(l);
    return `<div class="row"><div><b>${icon(e)} ${esc(e.name)}</b><div class="sub">${esc(e.detail||"")}${o?` · Sold: ${o}`:""}</div></div><b class="${x.p<0?"neg":"pos"}">${money(x.p)}</b></div>`}).join("")||`<p class="sub">Add your first crop or livestock in the Farm tab.</p>`;
  const last=[...fr].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,25).map(r=>{
    const e=ents.find(x=>x.id===r.entId);
    const amt=r.kind==="event"?"📌 Event":(r.kind==="sale"?"+ ":"− ")+money(r.amount);
    const q=r.qty?` · ${r.qty} ${esc(r.unit||"")}`:"";
    return `<div class="row"><div class="tap" data-edit="${r.id}"><b>${esc(r.label)}</b><div class="sub">${r.date||""} · ${esc(e?e.name:"?")}${q}</div></div><div><b class="${r.kind==="sale"?"pos":r.kind==="cost"?"neg":""}">${amt}</b><button class="x" data-del="${r.id}">✕</button></div></div>`}).join("")||`<p class="sub">No records for this filter.</p>`;
  A.innerHTML=`${remHtml}<div class="card filt"><div class="two">
  <div><label>Month</label><select id="fm"><option value="all">All time</option>${months.map(m=>`<option value="${m}" ${m===fMonth?"selected":""}>${monthLabel(m)}</option>`).join("")}</select></div>
  <div><label>Crop / livestock</label><select id="fe"><option value="all">All</option>${ents.map(e=>`<option value="${e.id}" ${e.id===fEnt?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div>
  </div></div>
  <div class="stats">
  <div class="stat profit ${t.p<0?"neg":""}"><small>Profit</small><b>${money(t.p)}</b></div>
  <div class="stat sales"><small>Sales</small><b>${money(t.s)}</b></div>
  <div class="stat costs"><small>Costs</small><b>${money(t.c)}</b></div></div>
  <div class="card"><h3>Crops &amp; livestock</h3>${rows}</div>
  <div class="card"><h3>Records</h3><p class="sub">Tap a record to edit it.</p>${last}</div>`;
}
function ins(){
  const mm={};
  recs.forEach(r=>{const m=(r.date||"").slice(0,7);if(!m)return;
    mm[m]=mm[m]||{s:0,c:0};
    if(r.kind==="sale")mm[m].s+=r.amount;if(r.kind==="cost")mm[m].c+=r.amount});
  const all=Object.keys(mm).sort();
  const keys=all.slice(-6),vals=keys.map(k=>mm[k].s-mm[k].c);
  const max=Math.max(1,...vals.map(Math.abs));
  const bars=keys.length?`<div class="bars">${keys.map((k,i)=>`<div class="bar"><b class="${vals[i]<0?"neg":"pos"}">${kfmt(vals[i])}</b><i class="${vals[i]<0?"n":""}" style="height:${Math.max(3,Math.round(Math.abs(vals[i])/max*100))}px"></i><small>${monthShort(k)}</small></div>`).join("")}</div>`:`<p class="sub">No records yet.</p>`;
  const cur=todayStr().slice(0,7);
  const full=all.filter(k=>k<cur).slice(-3);
  const avg=full.length?full.reduce((a,k)=>a+mm[k].s-mm[k].c,0)/full.length:0;
  const est=full.length>=2?`<div class="stat profit est ${avg<0?"neg":""}"><small>Expected profit next month</small><b>${money(avg)}</b></div><p class="sub">Average of your last ${full.length} full months. A simple estimate, not a guarantee.</p>`:`<p class="sub">The estimate needs records from at least 2 full months. Keep logging and it will appear.</p>`;
  const rank=ents.map(e=>({e,x:tot(recs.filter(r=>r.entId===e.id))})).sort((a,b)=>b.x.p-a.x.p);
  const rankHtml=rank.map(({e,x})=>{
    const roi=x.c>0?` · return ${Math.round(x.p/x.c*100)}% on costs`:"";
    return `<div class="row"><div><b>${icon(e)} ${esc(e.name)}</b><div class="sub">Sales ${money(x.s)} · Costs ${money(x.c)}${roi}</div></div><b class="${x.p<0?"neg":"pos"}">${money(x.p)}</b></div>`}).join("")||`<p class="sub">Add a crop or livestock first.</p>`;
  const cm={};let tc=0;
  recs.forEach(r=>{if(r.kind==="cost"&&r.amount>0){const k=r.label.trim().toLowerCase();cm[k]=(cm[k]||0)+r.amount;tc+=r.amount}});
  const costHtml=Object.entries(cm).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>
    `<div class="row"><b>${esc(k.charAt(0).toUpperCase()+k.slice(1))}</b><span>${money(v)} · ${Math.round(v/tc*100)}%</span></div>`).join("")||`<p class="sub">No costs recorded yet.</p>`;
  const pm={};
  recs.forEach(r=>{if(r.kind==="sale"&&r.qty>0&&r.unit&&r.amount>0){const k=r.entId+"|"+r.unit.trim().toLowerCase();
    pm[k]=pm[k]||{a:0,q:0};pm[k].a+=r.amount;pm[k].q+=r.qty}});
  const priceHtml=Object.entries(pm).map(([k,v])=>{const[id,u]=k.split("|"),e=ents.find(x=>x.id===id);
    return `<div class="row"><b>${esc(e?e.name:"?")}</b><span>${money(v.a/v.q)} per ${esc(u)}</span></div>`}).join("")||`<p class="sub">Add sales with a quantity and unit to see average prices.</p>`;
  A.innerHTML=`<div class="card"><h3>Profit by month</h3>${bars}</div>
  <div class="card"><h3>Next month estimate</h3>${est}</div>
  <div class="card"><h3>Best earners</h3>${rankHtml}</div>
  <div class="card"><h3>Where your money goes</h3>${costHtml}</div>
  <div class="card"><h3>Average selling price</h3>${priceHtml}</div>`;
}
function farm(){
  const list=ents.map(e=>`<div class="row"><b>${icon(e)} ${esc(e.name)}</b><span class="sub">${esc(e.detail||"")}</span></div>`).join("")||`<p class="sub">Nothing added yet.</p>`;
  A.innerHTML=`<div class="card"><h3>Add crop or livestock</h3>
  <label>Type</label><select id="ty"><option>Crop</option><option>Livestock</option></select>
  <label>Name</label><input id="nm" placeholder="e.g. Maize, Dairy cows">
  <label>Area (acres) or number of animals</label><input id="dt" placeholder="e.g. 2 acres, 5 cows">
  <button class="pri" id="sv">Save</button></div>
  <div class="card"><h3>Your farm</h3>${list}</div>`;
  $("sv").onclick=()=>{
    const n=$("nm").value.trim();if(!n)return alert("Write a name");
    const ref=doc(collection(db,"enterprises"));
    const e={type:$("ty").value,name:n,detail:$("dt").value.trim()};
    setDoc(ref,e);ents.push({id:ref.id,...e});farm();
  };
}
function add(){
  if(!ents.length){A.innerHTML=`<div class="card"><h3>Start here</h3><p>Add a crop or livestock in the Farm tab first.</p></div>`;return}
  const r=editId?recs.find(x=>x.id===editId):null;
  if(r)kind=r.kind;
  const v=(k,d="")=>r&&r[k]!==undefined&&r[k]!==0?r[k]:d;
  const K=[["cost","💸 Cost"],["sale","💰 Sale"],["event","📌 Event"]];
  A.innerHTML=`<div class="card"><h3>${r?"Edit record":"New record"}</h3>
  <label>For which crop / livestock?</label><select id="e">${ents.map(e=>`<option value="${e.id}" ${r&&r.entId===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select>
  <label>What kind?</label><div class="seg" id="seg">${K.map(k=>`<button data-k="${k[0]}" class="${k[0]===kind?"on":""}">${k[1]}</button>`).join("")}</div>
  <label>Details</label><input id="l" value="${r?esc(r.label):""}" placeholder="e.g. Fertilizer, Milk sold, Vaccination">
  <label>Amount (TSh, 0 for events)</label><input id="a" type="number" inputmode="decimal" value="${v("amount")}">
  <div class="two"><div><label>Quantity (optional)</label><input id="q" type="number" inputmode="decimal" value="${v("qty")}"></div>
  <div><label>Unit</label><input id="u" list="ul" value="${esc(v("unit"))}" placeholder="kg, litres..."></div></div>
  <datalist id="ul"><option>kg</option><option>litres</option><option>bags</option><option>eggs</option><option>trays</option><option>bunches</option><option>animals</option><option>pieces</option></datalist>
  <label>Date</label><input id="d" type="date" value="${r?r.date||"":todayStr()}">
  <label>⏰ Remind me on (optional)</label><input id="rd" type="date" value="${r&&r.remind?r.remind:""}">
  <button class="pri" id="sv">${r?"Update record":"Save record"}</button>
  ${r?`<button class="sec" id="cn">Cancel</button>`:""}</div>`;
  $("seg").onclick=e=>{const k=e.target.dataset.k;if(!k)return;kind=k;
    document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.k===k))};
  if(r)$("cn").onclick=()=>{editId=null;tab="home";render()};
  $("sv").onclick=()=>{
    const remind=$("rd").value;
    const d={entId:$("e").value,kind,label:$("l").value.trim(),amount:+$("a").value||0,qty:+$("q").value||0,unit:$("u").value.trim(),date:$("d").value,remind,done:r&&r.remind===remind?!!r.done:false};
    if(!d.label)return alert("Write the details");
    if(editId){setDoc(doc(db,"records",editId),d);recs=recs.map(x=>x.id===editId?{id:editId,...d}:x)}
    else{const ref=doc(collection(db,"records"));setDoc(ref,d);recs.push({id:ref.id,...d})}
    editId=null;tab="home";render();
  };
}
A.onchange=e=>{
  if(e.target.id==="fm"){fMonth=e.target.value;home()}
  else if(e.target.id==="fe"){fEnt=e.target.value;home()}
};
A.onclick=e=>{
  const b=e.target.closest("[data-del]");
  if(b){if(confirm("Delete this record?")){deleteDoc(doc(db,"records",b.dataset.del));recs=recs.filter(r=>r.id!==b.dataset.del);render()}return}
  const dn=e.target.closest("[data-done]");
  if(dn){const id=dn.dataset.done;updateDoc(doc(db,"records",id),{done:true});recs=recs.map(r=>r.id===id?{...r,done:true}:r);render();return}
  const t=e.target.closest("[data-edit]");
  if(t){editId=t.dataset.edit;tab="add";render()}
};
document.querySelectorAll("#nav button[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==="add")editId=null;render()});
$("out").onclick=()=>signOut(auth);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
